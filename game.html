<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Crash — Ракета</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080b11;--card:#111622;--card2:#182032;--line:#222c44;--tx:#e9eefc;--mute:#7d8aa8;--green:#2dff9a;--purple:#a66bff;--red:#ff4d6d;--cyan:#38d6ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.uname{font-weight:700;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.plus{width:36px;height:36px;border-radius:50%;border:0;background:var(--green);color:#04170d;font-size:22px;font-weight:800;line-height:1;cursor:pointer;box-shadow:0 0 14px #2dff9a66}
#hist{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 10px;scrollbar-width:none;min-height:36px}
#hist::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 10px;border-radius:14px;font-size:12px;font-weight:800;background:var(--card);border:1px solid var(--line);font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:0 12px 10px;gap:10px;overflow-y:auto;}
.screen.on{display:flex}
.stage{flex:1;min-height:200px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#050810;position:relative}
canvas{width:100%;height:100%;display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:11px;color:var(--mute);margin-bottom:4px}
.inp{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 10px}
.inp:focus-within{border-color:var(--cyan)}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font-size:16px;font-weight:700;padding:11px 0;font-family:inherit}
.inp span{color:var(--mute);font-size:13px}
#act{border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(90deg,#14a4f2,#2563eb);cursor:pointer;transition:transform .08s;box-shadow:0 6px 22px #2563eb55}
#act:active{transform:scale(.98)}
#act.cash{background:#ffb938;color:#04170d;box-shadow:0 0 24px #ffb93866;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.015)}}
#act:disabled{background:var(--card2);color:var(--mute);box-shadow:none;animation:none;cursor:default}
nav{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:var(--mute);padding:11px 0 10px;font-size:12px;font-weight:700;display:grid;gap:2px;justify-items:center;cursor:pointer}
nav button.on{color:var(--green)}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-bottom:20px}
.shop-item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.shop-item h4{font-size:14px;margin:0;}
.shop-item p{font-size:12px;color:var(--mute);margin:0;}
.shop-item button{width:100%;border:0;border-radius:10px;padding:8px;background:var(--green);color:#04170d;font-weight:800;cursor:pointer;margin-top:auto;}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none;}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.win{border-color:var(--green);color:var(--green)}
#toast.lose{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="ava" id="ava">?</div>
    <div class="uname" id="uname">Игрок</div>
    <div class="bal">💎 <span id="bal">0.00</span></div>
    <button class="plus" id="plus">+</button>
  </header>
  <div id="hist"></div>

  <main>
    <section class="screen on" id="s-crash">
      <div class="stage"><canvas id="cv"></canvas></div>
      <div class="panel">
        <div class="row">
          <div class="field"><label>Ставка</label>
            <div class="inp"><input id="amt" type="number" value="10" min="0.1" step="0.1"><span>💎</span></div></div>
          <div class="field"><label>Авто-вывод</label>
            <div class="inp"><input id="auto" type="number" placeholder="выкл." min="1.01" step="0.1"><span>x</span></div></div>
        </div>
        <button id="act">Сделать ставку</button>
      </div>
    </section>

    <section class="screen" id="s-inv">
       <div style="color:var(--mute);text-align:center;padding:20px;">Инвентарь пуст</div>
    </section>

    <section class="screen" id="s-shop">
      <h3 style="margin:10px 0;text-align:center;">Магазин подарков</h3>
      <div class="shop-grid" id="shop-grid"></div>
    </section>
  </main>

  <nav>
    <button class="on" data-tab="crash">🚀 Краш</button>
    <button data-tab="inv">🎒 Инвентарь</button>
    <button data-tab="shop">🛍 Магазин</button>
  </nav>
</div>
<div id="toast"></div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#080b11');tg.setBackgroundColor('#080b11');}catch(e){}}

let balance = 0, ws = null, phase = 'waiting', mult = 1, bet = null;

function send(type, data = {}) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type, initData: tg ? tg.initData : '', ...data }));
    }
}

function connect() {
    // Адрес твоего сервера Render
    ws = new WebSocket('wss://crash-game-b0pv.onrender.com/ws');
    ws.onopen = () => send('auth');
    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'hello') { balance = msg.balance; updateBalance(); }
        else if (msg.type === 'balance') { balance = msg.balance; updateBalance(); }
        else if (msg.type === 'gifts_list') { renderShop(msg.gifts); }
        else if (msg.type === 'gift_bought') { toast(msg.msg, 'win'); send('get_gifts'); }
        else if (msg.type === 'error') { toast(msg.msg, 'lose'); }
    };
    ws.onclose = () => setTimeout(connect, 2000);
}

function updateBalance() { $('bal').textContent = parseFloat(balance).toFixed(2); }
function toast(msg, cls) { const t=$('toast'); t.textContent=msg; t.className='on '+(cls||''); setTimeout(()=>t.className='',2500); }

// --- МАГАЗИН С 3D КАРТИНКАМИ ---
const SHOP_ITEMS = [
    { id: "5170145012310081615", title: "Ракета", stars: 50, img: "https://image.pollinations.ai/prompt/3D%20render%20of%20a%20Telegram%20gift%20Rocket,%20glossy%20shiny%20material,%20vibrant%20colors,%20isolated%20on%20dark%20purple%20background,%20isometric%20view,%20game%20asset%20style,%20highly%20detailed,%208k%20render?width=200&height=200&nologo=true" },
    { id: "5170250944449450862", title: "Мишка", stars: 100, img: "https://image.pollinations.ai/prompt/3D%20render%20of%20a%20Telegram%20gift%20Teddy%20Bear,%20glossy%20shiny%20material,%20vibrant%20colors,%20isolated%20on%20dark%20purple%20background,%20isometric%20view,%20game%20asset%20style,%20highly%20detailed,%208k%20render?width=200&height=200&nologo=true" },
    { id: "5170250944449450865", title: "Корона", stars: 500, img: "https://image.pollinations.ai/prompt/3D%20render%20of%20a%20Telegram%20gift%20Golden%20Crown,%20glossy%20shiny%20material,%20vibrant%20colors,%20isolated%20on%20dark%20purple%20background,%20isometric%20view,%20game%20asset%20style,%20highly%20detailed,%208k%20render?width=200&height=200&nologo=true" }
];

function renderShop(gifts) {
    const grid = $('shop-grid');
    grid.innerHTML = '';
    SHOP_ITEMS.forEach(g => {
        const div = document.createElement('div');
        div.className = 'shop-item';
        div.innerHTML = `<img src="${g.img}" style="width:100px;height:100px;object-fit:contain;"><h4>${g.title}</h4><p>${g.stars} 💎</p><button onclick="window.buyGift('${g.id}', ${g.stars})">Купить</button>`;
        grid.appendChild(div);
    });
}

window.buyGift = (giftId, price) => {
    if (balance < price) { toast('Недостаточно 💎', 'lose'); return; }
    send('buy_gift', { gift_id: giftId, price: price });
};

// Навигация
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
    $(`s-${b.dataset.tab}`).classList.add('on');
    if (b.dataset.tab === 'shop') send('get_gifts');
}));

// Пополнение
$('plus').onclick = () => { tg.close(); };

// Пользователь
const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
$('uname').textContent = u ? (u.first_name || u.username || 'Игрок') : 'Игрок';
$('ava').textContent = (u ? u.first_name.charAt(0) : '?').toUpperCase();

// --- ИГРА (Канвас) ---
const cv = $('cv'), ctx = cv.getContext('2d');
function resize() { const r=cv.parentElement.getBoundingClientRect(); cv.width=r.width; cv.height=r.height; }
window.addEventListener('resize', resize);
resize();

function draw() {
    ctx.fillStyle = '#070a24'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(phase === 'waiting' ? 'Ожидание...' : 'x' + mult.toFixed(2), cv.width/2, cv.height/2);
    requestAnimationFrame(draw);
}
draw();

$('act').onclick = () => {
    if(phase === 'waiting') {
        let amt = parseFloat($('amt').value);
        if(amt > balance) { toast('Недостаточно средств', 'lose'); return; }
        send('bet', {amt: amt});
    }
};

connect();
})();
</script>
</body>
</html>
