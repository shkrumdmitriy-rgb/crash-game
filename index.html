<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Crash — Ракета</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Твой старый CSS оставляем без изменений, я добавил только стили для магазина */
:root{--bg:#080b11;--card:#111622;--card2:#182032;--line:#222c44;--tx:#e9eefc;--mute:#7d8aa8;--green:#2dff9a;--purple:#a66bff;--red:#ff4d6d;--cyan:#38d6ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.uname{font-weight:700;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.plus{width:36px;height:36px;border-radius:50%;border:0;background:var(--green);color:#04170d;font-size:22px;font-weight:800;line-height:1;cursor:pointer;box-shadow:0 0 14px #2dff9a66}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:0 12px 10px;gap:10px;overflow-y:auto;}
.screen.on{display:flex}
/* Стили магазина */
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.shop-item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.shop-item h4{font-size:14px;margin:0;}
.shop-item p{font-size:12px;color:var(--mute);margin:0;}
.shop-item button{width:100%;border:0;border-radius:10px;padding:8px;background:var(--green);color:#04170d;font-weight:800;cursor:pointer;margin-top:auto;}
nav{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:var(--mute);padding:11px 0 10px;font-size:12px;font-weight:700;display:grid;gap:2px;justify-items:center;cursor:pointer}
nav button.on{color:var(--green)}
/* Остальные стили для канваса, инпута и т.д. ты можешь оставить своими */
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.on{display:flex}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;border:1px solid var(--line);padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none;}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="ava" id="ava">?</div>
    <div class="uname" id="uname">Игрок</div>
    <div class="bal">💎 <span id="bal">0.00</span></div>
    <button class="plus" id="plus" aria-label="Пополнить баланс">+</button>
  </header>

  <main>
    <!-- ЭКРАН КРАША (твой старый, я его скрыл для краткости) -->
    <section class="screen on" id="s-crash">
      <div style="flex:1;display:grid;place-items:center;color:var(--mute)">Здесь игра (ракета)</div>
    </section>

    <!-- ЭКРАН ИНВЕНТАРЯ (твой старый) -->
    <section class="screen" id="s-inv">
       <div style="color:var(--mute);text-align:center;padding:20px;">Инвентарь</div>
    </section>

    <!-- НОВЫЙ ЭКРАН МАГАЗИНА -->
    <section class="screen" id="s-shop">
      <h3 style="margin:10px 0;text-align:center;">Магазин подарков</h3>
      <div class="shop-grid" id="shop-grid">
        <!-- Сюда будут загружаться подарки с сервера -->
      </div>
    </section>
  </main>

  <nav>
    <button class="on" data-tab="crash">Краш</button>
    <button data-tab="inv">Инвентарь</button>
    <button data-tab="shop">🛍 Магазин</button>
  </nav>
</div>

<!-- Модалка пополнения (оставим как есть) -->
<div class="modal" id="modal">
  <div class="sheet">
    <h3>Пополнение</h3>
    <button id="topgo" style="border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800;background:var(--green);color:#04170d;cursor:pointer">Пополнить на 10 ⭐</button>
    <button class="close" id="mclose" style="background:none;border:0;color:var(--mute);padding:8px;">Закрыть</button>
  </div>
</div>
<div id="toast"></div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#080b11');tg.setBackgroundColor('#080b11');}catch(e){}}

let myId=null;
let balance = 0;
let ws = null;

// Отправка сообщений на сервер
function send(type, data = {}) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type, initData: tg ? tg.initData : '', ...data }));
    }
}

// Подключение к серверу
function connect() {
    const wsUrl = window.CRASH_WS_URL || 'wss://ваш-сервер-адрес/ws';
    ws = new WebSocket(wsUrl);
    
    ws.onopen = () => {
        send('auth'); // Авторизация при подключении
    };
    
    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'hello') {
            myId = msg.uid;
            balance = msg.balance;
            updateBalance();
        } else if (msg.type === 'balance') {
            balance = msg.balance;
            updateBalance();
        } else if (msg.type === 'gifts_list') {
            renderShop(msg.gifts);
        } else if (msg.type === 'gift_bought') {
            toast(msg.msg, 'win');
            send('get_gifts'); // Обновить список (если баланс изменился)
        } else if (msg.type === 'error') {
            toast(msg.msg, 'lose');
        }
    };
    
    ws.onclose = () => setTimeout(connect, 2000); // Переподключение
}

function updateBalance() {
    $('bal').textContent = parseFloat(balance).toFixed(2);
}

function toast(msg, cls) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'on ' + (cls || '');
    setTimeout(() => t.className = '', 2500);
}

// Рендер реальных подарков
function renderShop(gifts) {
    const grid = $('shop-grid');
    grid.innerHTML = '';
    gifts.forEach(g => {
        const div = document.createElement('div');
        div.className = 'shop-item';
        div.innerHTML = `
            <h4>${g.title}</h4>
            <p>${g.stars} 💎</p>
            <button onclick="buyGift('${g.id}', ${g.stars})">Купить</button>
        `;
        grid.appendChild(div);
    });
}

// Покупка подарка
window.buyGift = (giftId, price) => {
    if (balance < price) {
        toast('Недостаточно 💎', 'lose');
        return;
    }
    send('buy_gift', { gift_id: giftId, price: price });
};

// Навигация по вкладкам
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
    $(`s-${b.dataset.tab}`).classList.add('on');
    
    if (b.dataset.tab === 'shop') {
        send('get_gifts'); // Запрос подарков при входе в магазин
    }
}));

// Пополнение (открывает модалку)
$('plus').onclick = () => $('modal').classList.add('on');
$('mclose').onclick = () => $('modal').classList.remove('on');
$('topgo').onclick = () => {
    // В реальности здесь нужно отправлять запрос боту на генерацию инвойса
    // Пока просто закрываем, так как пополнение у нас в боте
    tg.close(); // Закрыть Mini App, чтобы зайти в бота и пополнить
    // Или можно сделать кнопку в боте
};

// Пользователь
const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
$('uname').textContent = u ? (u.first_name || u.username || 'Игрок') : 'Игрок';
$('ava').textContent = (u ? u.first_name.charAt(0) : '?').toUpperCase();

connect();

})();
</script>
</body>
</html>
